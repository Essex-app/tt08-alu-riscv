# Tiny Tapeout project information
project:
  title: "ALU 8-bit RISC-V"      # Project title
  author:       "MpKs"      # Your name
  discord:      ""      # Your discord username, for communication and automatically assigning you a Tapeout role (optional)
  description:  "ALU de 8 bits para processador RISC-V"      # One line description of what your project does
  language:     "Verilog" # other examples include SystemVerilog, Amaranth, VHDL, etc
  clock_hz:     0       # Clock frequency in Hz (or 0 if not applicable)

  # How many tiles your design occupies? A single tile is about 167x108 uM.
  tiles: "1x1"          # Valid values: 1x1, 1x2, 2x2, 3x2, 4x2, 6x2 or 8x2

  # Your top module name must start with "tt_um_". Make it unique by including your github username:
  top_module:  "tt_um_mpks_alu"

  # List your project's source files here.
  # Source files must be in ./src and you must list each source file separately, one per line.
  # Don't forget to also update `PROJECT_SOURCES` in test/Makefile.
  source_files:
    - "project.v"

# The pinout of your project. Leave unused pins blank. DO NOT delete or add any pins.
# Descrição dos pinos de entrada e saída
pinout:
  # Entradas digitais dedicadas
  ui[0]: "Operando A - Bit 0"
  ui[1]: "Operando A - Bit 1"
  ui[2]: "Operando A - Bit 2"
  ui[3]: "Operando A - Bit 3"
  ui[4]: "Operando A - Bit 4"
  ui[5]: "Operando A - Bit 5"
  ui[6]: "Operando A - Bit 6"
  ui[7]: "Operando A - Bit 7"

  # Saídas digitais dedicadas
  uo[0]: "Resultado - Bit 0"
  uo[1]: "Resultado - Bit 1"
  uo[2]: "Resultado - Bit 2"
  uo[3]: "Resultado - Bit 3"
  uo[4]: "Resultado - Bit 4"
  uo[5]: "Resultado - Bit 5"
  uo[6]: "Resultado - Bit 6"
  uo[7]: "Resultado - Bit 7"

  # Entradas/Saídas bidirecionais (usadas para o Operando B)
  uio[0]: "Operando B - Bit 0"
  uio[1]: "Operando B - Bit 1"
  uio[2]: "Operando B - Bit 2"
  uio[3]: "Operando B - Bit 3"
  uio[4]: "Operando B - Bit 4"
  uio[5]: "Operando B - Bit 5"
  uio[6]: "Operando B - Bit 6"
  uio[7]: "Operando B - Bit 7"

# Do not change!
yaml_version: 6
